name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Compile Python sources
        run: .\.venv\Scripts\python.exe -m compileall -q api.py exporter.py fetch.py gui.py parser.py service.py tests
      - name: Build standalone Windows app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-exe.ps1
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValorantMatchFetcher-windows
          path: dist/ValorantMatchFetcher.exe
          if-no-files-found: error
